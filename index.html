<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rota Express — Entregas rápidas e seguras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            preto: '#0a0a0a',
                            cinza: '#141414',
                            'cinza-medio': '#1e1e1e',
                            vermelho: '#DC2626',
                            'vermelho-escuro': '#991B1B',
                            'vermelho-claro': '#EF4444',
                            'cinza-claro': '#a3a3a3',
                        }
                    },
                    fontFamily: {
                        rota: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .nav-btn {
            position: relative;
            transition: color 0.2s ease;
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #DC2626;
            transition: width 0.2s ease;
        }
        .nav-btn.ativo {
            color: #DC2626;
        }
        .nav-btn.ativo::after {
            width: 60%;
        }
        .nav-btn.ativo .nav-icon {
            stroke: #DC2626;
        }
        .nav-btn.ativo .nav-label {
            color: #DC2626;
        }
        .nav-icon {
            transition: stroke 0.2s ease;
        }
    </style>
</head>
<body class="bg-marca-preto text-white font-rota antialiased">

    <div class="max-w-[375px] mx-auto min-h-screen flex flex-col relative">

        <header class="bg-marca-cinza border-b border-marca-vermelho/20 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
            <svg viewBox="0 0 40 40" class="w-9 h-9 shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="28" r="7.5" stroke="#DC2626" stroke-width="2"/>
                <circle cx="30" cy="28" r="7.5" stroke="#DC2626" stroke-width="2"/>
                <path d="M10 28h7l5.5-10h4l3.5 8" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="27" cy="16" r="2.5" fill="#DC2626"/>
                <path d="M24 13l-1.5-3" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M12 21l2 3h13" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
            </svg>
            <div>
                <h1 class="text-[15px] font-bold tracking-[0.15em] text-white leading-tight uppercase">Rota Express</h1>
                <p class="text-[9px] text-marca-vermelho tracking-[0.25em] uppercase font-light">Entregas rápidas e seguras</p>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto pb-24">
            <!-- TELAS -->
        </main>

        <nav class="fixed bottom-0 left-0 right-0 z-50 bg-marca-cinza border-t border-white/5">
            <div class="max-w-[375px] mx-auto flex items-stretch">

                <button data-nav="selecao-de-perfil" onclick="mostrarTela('selecao-de-perfil')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Perfil</span>
                </button>

                <button data-nav="login-cadastro" onclick="mostrarTela('login-cadastro')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Login</span>
                </button>

                <button data-nav="solicitar-corrida-entrega-cliente" onclick="mostrarTela('solicitar-corrida-entrega-cliente')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Solicitar</span>
                </button>

                <button data-nav="acompanhamento-do-trajeto-cliente" onclick="mostrarTela('acompanhamento-do-trajeto-cliente')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Trajeto</span>
                </button>

                <button data-nav="novos-pedidos-motorista" onclick="mostrarTela('novos-pedidos-motorista')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Pedidos</span>
                </button>

                <button data-nav="corrida-em-andamento-motorista" onclick="mostrarTela('corrida-em-andamento-motorista')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Corrida</span>
                </button>

            </div>
        </nav>

    </div>

    <script>
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function (s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function (b) {
                b.classList.toggle('ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }

        document.addEventListener('DOMContentLoaded', function () {
            mostrarTela('selecao-de-perfil');
        });
    </script>

</body>
</html>
