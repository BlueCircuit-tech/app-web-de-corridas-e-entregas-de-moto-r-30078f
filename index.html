<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            preto: '#0a0a0a',
                            cinza: '#141414',
                            'cinza-medio': '#1e1e1e',
                            vermelho: '#DC2626',
                            'vermelho-escuro': '#991B1B',
                            'vermelho-claro': '#EF4444',
                            'cinza-claro': '#a3a3a3',
                        }
                    },
                    fontFamily: {
                        rota: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .nav-btn {
            position: relative;
            transition: color 0.2s ease;
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #DC2626;
            transition: width 0.2s ease;
        }
        .nav-btn.ativo {
            color: #DC2626;
        }
        .nav-btn.ativo::after {
            width: 60%;
        }
        .nav-btn.ativo .nav-icon {
            stroke: #DC2626;
        }
        .nav-btn.ativo .nav-label {
            color: #DC2626;
        }
        .nav-icon {
            transition: stroke 0.2s ease;
        }
    </style>
</head>

        <main class="flex-1 overflow-y-auto pb-24">
            <section data-tela="selecao-de-perfil" class="hidden">

                <div class="w-28 h-28 bg-red-600 rounded-full flex items-center justify-center shadow-lg shadow-red-600/30">
                    <svg class="w-16 h-16 text-white" viewBox="0 0 64 64" fill="currentColor">

                        <path d="M22 38l6-14h8l4 8 6-4h4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Nome e slogan -->

                    Entregas rápidas e seguras

                <svg class="w-5 h-5 text-white/60 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <!-- Sou Motorista -->
            <button onclick="selecao_de_perfil_escolher('motorista')" class="group relative w-full bg-neutral-900 border-2 border-neutral-700 hover:border-red-600 text-white rounded-2xl px-6 py-5 flex items-center gap-4 transition-all duration-200 active:scale-[0.98]">

        <!-- Rodapé -->
        <div class="flex flex-col items-center gap-3 relative z-10">
            <div class="flex items-center gap-4 text-neutral-600">
                <a href="#" class="hover:text-red-500 transition-colors"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.963 19.963 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
            </div>
            <p class="text-neutral-700 text-xs text-center">© 2025 Rota Express — CNPJ 00.000.000/0001-00</p>
            <p class="text-neutral-800 text-[10px]">São Paulo — Brasil</p>
        </div>
    </div>

    <!-- Overlay de confirmação (oculto por padrão) -->
    <div id="selecao-de-perfil-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end justify-center" onclick="selecao_de_perfil_fecharOverlay(event)">
        <div id="selecao-de-perfil-overlay-card" class="bg-neutral-900 border-t border-neutral-700 rounded-t-3xl w-full max-w-[375px] p-6 transform translate-y-full transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="w-10 h-1 bg-neutral-700 rounded-full mx-auto mb-5"></div>
            <h3 id="selecao-de-perfil-overlay-titulo" class="text-white text-xl font-bold text-center mb-2"></h3>
            <p id="selecao-de-perfil-overlay-descricao" class="text-neutral-400 text-sm text-center mb-6"></p>
            <div class="flex gap-3">
                <button onclick="selecao_de_perfil_irLogin()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition-colors active:scale-[0.97]">
                    Continuar
                </button>
                <button onclick="selecao_de_perfil_fecharOverlay()" class="px-6 bg-neutral-800 hover:bg-neutral-700 text-white font-medium py-3.5 rounded-xl transition-colors active:scale-[0.97]">
                    Voltar
                </button>
            </div>
        </div>
    </div>

    <script>
    function selecao_de_perfil_escolher(perfil) {
        const titulos = {
            'cliente': 'Solicitar corrida ou entrega',
            'motorista': 'Área do Motorista'
        };
        const descricoes = {
            'cliente': 'Informe origem e destino para solicitar um motoboy ou entrega agora mesmo.',
            'motorista': 'Visualize pedidos disponíveis na sua região e aceite corridas para começar a rodar.'
        };

        selecao_de_perfil_perfilSelecionado = perfil;
        document.getElementById('selecao-de-perfil-overlay-titulo').textContent = titulos[perfil];
        document.getElementById('selecao-de-perfil-overlay-descricao').textContent = descricoes[perfil];

        const overlay = document.getElementById('selecao-de-perfil-overlay');
        const card = document.getElementById('selecao-de-perfil-overlay-card');
        overlay.classList.remove('hidden');
        requestAnimationFrame(() => {
            card.classList.remove('translate-y-full');
            card.classList.add('translate-y-0');
        });
    }

    function selecao_de_perfil_fecharOverlay(event) {
        if (event && event.target !== event.currentTarget) return;
        const card = document.getElementById('selecao-de-perfil-overlay-card');
        card.classList.remove('translate-y-0');
        card.classList.add('translate-y-full');
        setTimeout(() => {
            document.getElementById('selecao-de-perfil-overlay').classList.add('hidden');
        }, 300);
    }

    function selecao_de_perfil_irLogin() {
        selecao_de_perfil_fecharOverlay();
        setTimeout(() => {
            mostrarTela('login-cadastro');
        }, 200);
    }

    let selecao_de_perfil_perfilSelecionado = null;
    </script>
</section>

    <section data-tela="login-cadastro" class="hidden">
        <div class="min-h-screen bg-white flex flex-col">
            <!-- Header -->
            <div class="bg-black px-5 pt-8 pb-5 rounded-b-3xl">

            <form id="form-login" class="flex-1 px-5 mt-5 space-y-4 overflow-y-auto pb-6" onsubmit="event.preventDefault();">

            <!-- Formulário CADASTRO -->

                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Criar senha</label>
                    <div class="relative">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                        <input id="cad-senha" type="password" placeholder="Mínimo 6 caracteres" class="w-full pl-11 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
                        <button type="button" onclick="login_cadastro_toggleSenha(this)" class="absolute right-3 top-3 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Campos exclusivos do Motorista -->
                <div id="campos-motorista" class="hidden space-y-4 pt-2">
                    <div class="bg-red-50 border border-red-200 rounded-xl p-3.5">
                        <p class="text-xs font-semibold text-red-700 mb-3 flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>
                            Dados do veículo
                        </p>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-medium text-red-800 mb-1">Tipo de veículo</label>
                                <select id="cad-tipo-veiculo" class="w-full px-3 py-2.5 bg-white border border-red-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                                    <option value="">Selecione...</option>
                                    <option value="moto">Moto</option>
                                    <option value="moto-carga">Moto de Carga</option>
                                    <option value="bike">Bicicleta</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-red-800 mb-1">Modelo da moto</label>
                                <input id="cad-modelo" type="text" placeholder="Ex: Honda CG 160 Fan" class="w-full px-3 py-2.5 bg-white border border-red-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-red-800 mb-1">Placa</label>
                                <input id="cad-placa" type="text" placeholder="ABC-1234" maxlength="8" class="w-full px-3 py-2.5 bg-white border border-red-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 uppercase" />
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-red-800 mb-1">CNH</label>
                                <input id="cad-cnh" type="text" placeholder="Número da CNH" class="w-full px-3 py-2.5 bg-white border border-red-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" onclick="login_cadastro_fazerCadastro()" class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.97] text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-red-200 mt-2">
                    Criar Conta
                </button>
            </form>

            <!-- Toast de sucesso -->
            <div id="toast-login-cadastro" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-xl text-sm font-medium shadow-2xl opacity-0 pointer-events-none transition-all duration-300 translate-y-4 z-50 flex items-center gap-2">
                <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="toast-msg-login-cadastro"></span>
            </div>
        </div>
    </section>
    <script>
        let login_cadastro_tipoPerfil = 'cliente';

        function login_cadastro_alternarTab(tab) {
            const btnLogin = document.getElementById('btn-tab-login');
            const btnCadastro = document.getElementById('btn-tab-cadastro');
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            if (tab === 'login') {
                btnLogin.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-black text-white shadow-sm';
                btnCadastro.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-gray-500';
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
            } else {
                btnCadastro.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-black text-white shadow-sm';
                btnLogin.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-gray-500';
                formCadastro.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function login_cadastro_setPerfil(tipo) {
            login_cadastro_tipoPerfil = tipo;
            const badge = document.getElementById('badge-perfil');
            const texto = document.getElementById('texto-badge-perfil');
            const camposMoto = document.getElementById('campos-motorista');
            if (tipo === 'motorista') {
                badge.className = 'mx-5 mt-4 px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-medium bg-yellow-50 text-yellow-700 border border-yellow-200';
                texto.textContent = 'Perfil: Motorista';
                camposMoto.classList.remove('hidden');
            } else {
                badge.className = 'mx-5 mt-4 px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-medium bg-red-50 text-red-700 border border-red-200';
                texto.textContent = 'Perfil: Cliente';
                camposMoto.classList.add('hidden');
            }
        }

        function login_cadastro_toggleSenha(btn) {
            const input = btn.parentElement.querySelector('input');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243l4.242 4.242z"/></svg>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';
            }
        }

        function login_cadastro_fazerLogin() {
            const telefone = document.querySelector('#form-login input[type="text"]');
            const senha = document.querySelector('#form-login input[type="password"]');
            if (!telefone.value.trim()) {
                telefone.classList.add('ring-2', 'ring-red-400');
                telefone.focus();
                setTimeout(() => telefone.classList.remove('ring-2', 'ring-red-400'), 2000);
                return;
            }
            if (login_cadastro_tipoPerfil === 'motorista') {
                mostrarTela('novos-pedidos-motorista');
            } else {
                mostrarTela('solicitar-corrida-entrega-cliente');
            }
            login_cadastro_mostrarToast('Login realizado com sucesso!');
        }

        function login_cadastro_fazerCadastro() {
            const nome = document.getElementById('cad-nome');
            const telefone = document.getElementById('cad-telefone');
            const email = document.getElementById('cad-email');
            const senha = document.getElementById('cad-senha');
            let valido = true;
            [nome, telefone, email, senha].forEach(el => {
                if (!el.value.trim()) {
                    el.classList.add('ring-2', 'ring-red-400');
                    valido = false;
                    setTimeout(() => el.classList.remove('ring-2', 'ring-red-400'), 2000);
                }
            });
            if (!valido) return;
            if (senha.value.length < 6) {
                login_cadastro_mostrarToast('A senha deve ter ao menos 6 caracteres.');
                return;
            }
            if (login_cadastro_tipoPerfil === 'motorista') {
                const tipoVeiculo = document.getElementById('cad-tipo-veiculo');
                const modelo = document.getElementById('cad-modelo');
                const placa = document.getElementById('cad-placa');
                const cnh = document.getElementById('cad-cnh');
                if (!tipoVeiculo.value || !modelo.value.trim() || !placa.value.trim() || !cnh.value.trim()) {
                    login_cadastro_mostrarToast('Preencha todos os dados do veículo.');
                    return;
                }
            }
            login_cadastro_mostrarToast('Conta criada! Faça login para continuar.');
            setTimeout(() => login_cadastro_alternarTab('login'), 1500);
        }

        function login_cadastro_mostrarToast(msg) {
            const toast = document.getElementById('toast-login-cadastro');
            const txt = document.getElementById('toast-msg-login-cadastro');
            txt.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }
    </script>

    <!-- TELAS -->
        </main>

        <nav class="fixed bottom-0 left-0 right-0 z-50 bg-marca-cinza border-t border-white/5">
            <div class="max-w-[375px] mx-auto flex items-stretch">

                <button data-nav="selecao-de-perfil" onclick="mostrarTela('selecao-de-perfil')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Perfil</span>
                </button>

                <button data-nav="login-cadastro" onclick="mostrarTela('login-cadastro')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Login</span>
                </button>

                <button data-nav="solicitar-corrida-entrega-cliente" onclick="mostrarTela('solicitar-corrida-entrega-cliente')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Solicitar</span>
                </button>

                <button data-nav="acompanhamento-do-trajeto-cliente" onclick="mostrarTela('acompanhamento-do-trajeto-cliente')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Trajeto</span>
                </button>

                <button data-nav="novos-pedidos-motorista" onclick="mostrarTela('novos-pedidos-motorista')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Pedidos</span>
                </button>

                <button data-nav="corrida-em-andamento-motorista" onclick="mostrarTela('corrida-em-andamento-motorista')" class="nav-btn flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 text-marca-cinza-claro">
                    <svg class="nav-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span class="nav-label text-[9px] tracking-wide font-light uppercase">Corrida</span>
                </button>

            </div>
        </nav>

    </div>

    <script>
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function (s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function (b) {
                b.classList.toggle('ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }

        document.addEventListener('DOMContentLoaded', function () {
            mostrarTela('selecao-de-perfil');
        });
    </script>

</body>
